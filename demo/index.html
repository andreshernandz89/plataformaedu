<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{ font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:#0D1830; display:flex; flex-direction:column; }
  header{ background:linear-gradient(90deg,#0D1830,#13213F); color:#fff; padding:10px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header img{ height:34px; width:auto; }
  header .tit{ font-size:15px; font-weight:800; letter-spacing:.2px; border-left:1px solid #33507E; padding-left:16px; }
  header .tit span{ color:#14B8A6; }
  header .sp{ flex:1; }
  .cred{ background:#1B3263; border:1px solid #33507E; color:#D6E2F5; font-size:12.5px; border-radius:999px; padding:6px 12px; }
  .cred code{ color:#fff; font-weight:700; }
  .btn{ background:#0792FE; color:#fff; text-decoration:none; font-weight:700; font-size:13.5px; border-radius:9px; padding:8px 14px; }
  .btn.suave{ background:transparent; border:1.5px solid #33507E; }
  .aviso{ background:#FFF7E0; color:#6B5200; font-size:13px; text-align:center; padding:7px 12px; }
  iframe{ flex:1; width:100%; border:0; background:#fff; }
  footer{ background:#0D1830; color:#8DA0C4; font-size:12px; text-align:center; padding:8px 10px; }
</style>
