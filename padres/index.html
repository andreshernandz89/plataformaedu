<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#13213F">
<title>PlataformaEDU Padres — Selecciona tu colegio</title>
<meta name="description" content="Consulta las notas, la asistencia y los pagos de tu hijo. Selecciona el colegio para ingresar a la consulta de padres de familia.">
<link rel="icon" href="/simbolo-web.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --marino:#13213F; --azul:#0792FE; --gris:#5A6B84; --fondo:#F5F8FC; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif; background:var(--fondo); color:var(--marino); min-height:100vh; display:flex; flex-direction:column; }
  header{ background:var(--marino); padding:28px 20px 30px; text-align:center; border-radius:0 0 28px 28px; }
  header img{ height:54px; width:auto; background:#fff; border-radius:14px; padding:6px 14px; }
  header h1{ color:#fff; font-size:24px; font-weight:900; margin-top:14px; }
  header p{ color:#B9C8E4; font-size:15px; font-weight:600; margin-top:6px; }
  main{ flex:1; width:100%; max-width:560px; margin:0 auto; padding:26px 18px 34px; }
  .intro{ text-align:center; color:var(--gris); font-size:16px; font-weight:600; line-height:1.5; }
  .intro strong{ color:var(--marino); }
  .lista{ margin-top:22px; display:flex; flex-direction:column; gap:14px; }
  .colegio{ display:flex; align-items:center; gap:16px; background:#fff; border:1px solid #E1EAF6; border-radius:20px; padding:16px 18px; text-decoration:none; color:var(--marino); box-shadow:0 6px 18px rgba(19,33,63,.06); transition:transform .15s ease, box-shadow .15s ease; }
  .colegio:active{ transform:scale(.985); }
  .colegio img{ width:56px; height:56px; object-fit:contain; border-radius:14px; background:#fff; border:1px solid #E1EAF6; padding:4px; flex:none; }
  .colegio .nombre{ font-size:17px; font-weight:800; line-height:1.25; }
  .colegio .sub{ font-size:13px; font-weight:600; color:var(--gris); margin-top:2px; }
  .colegio .flecha{ margin-left:auto; flex:none; width:36px; height:36px; border-radius:50%; background:var(--azul); color:#fff; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:900; }
  footer{ text-align:center; padding:18px; color:var(--gris); font-size:13px; font-weight:600; }
  footer a{ color:var(--azul); text-decoration:none; font-weight:800; }
</style>
</head>
<body>
<header>
  <img src="/logo-correo.png" alt="PlataformaEDU">
  <h1>PlataformaEDU Padres</h1>
  <p>Las notas, la asistencia y los pagos de tu hijo, en un solo lugar.</p>
</header>
<main>
  <p class="intro">Selecciona el <strong>colegio</strong> de tu hijo para ingresar a su consulta de padres de familia.</p>
  <div class="lista" id="lista"></div>
</main>
<footer>Un servicio de <a href="https://plataformaedu.app">PlataformaEDU</a> · <a href="https://plataformaedu.app/privacidad/">Política de privacidad</a></footer>
<script>
  // Registro de colegios con consulta de padres activa.
  // Para agregar un colegio: una línea con su nombre, su logo y la URL de su consulta.
  var COLEGIOS = [
    { nombre: 'Centro Educativo Maravillas Infantiles', ciudad: 'Barranquilla', logo: 'https://maravillasinfantiles.com/escudo.png', url: 'https://maravillasinfantiles.com/padres/' },
    { nombre: 'Colegio Demo Santa Fe', ciudad: 'Demostración', logo: 'https://andreshernandz89.github.io/plataforma-demo/escudo.png', url: 'https://andreshernandz89.github.io/plataforma-demo/padres/' }
  ];
  var lista = document.getElementById('lista');
  COLEGIOS.forEach(function (c) {
    var a = document.createElement('a');
    a.className = 'colegio';
    a.href = c.url;
    var img = document.createElement('img');
    img.src = c.logo; img.alt = ''; img.loading = 'lazy';
    var txt = document.createElement('div');
    var n = document.createElement('div'); n.className = 'nombre'; n.textContent = c.nombre;
    var s = document.createElement('div'); s.className = 'sub'; s.textContent = c.ciudad;
    txt.appendChild(n); txt.appendChild(s);
    var f = document.createElement('div'); f.className = 'flecha'; f.textContent = '›';
    a.appendChild(img); a.appendChild(txt); a.appendChild(f);
    lista.appendChild(a);
  });
</script>
</body>
</html>
