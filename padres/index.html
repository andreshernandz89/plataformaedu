  header{ padding:34px 20px 8px; text-align:center; }
  header img{ height:54px; width:auto; background:#fff; border-radius:14px; padding:6px 14px; box-shadow:0 10px 26px rgba(0,0,0,.35); }
  header h1{ color:#fff; font-size:26px; font-weight:900; margin-top:16px; text-shadow:0 2px 14px rgba(0,0,0,.45); }
  header p{ color:#B9C8E4; font-size:15px; font-weight:600; margin-top:6px; }
  main{ flex:1; width:100%; max-width:560px; margin:0 auto; padding:26px 18px 34px; }
  .intro{ text-align:center; color:#C9D6EE; font-size:16px; font-weight:600; line-height:1.5; }
  .intro strong{ color:#fff; }
  .lista{ margin-top:22px; display:flex; flex-direction:column; gap:14px; }
  .colegio{ display:flex; align-items:center; gap:16px; background:rgba(255,255,255,.09); -webkit-backdrop-filter:blur(14px) saturate(140%); backdrop-filter:blur(14px) saturate(140%); border:1px solid rgba(255,255,255,.22); border-radius:22px; padding:16px 18px; text-decoration:none; color:#fff; box-shadow:0 12px 30px rgba(0,0,0,.35); transition:transform .15s ease, box-shadow .15s ease, background .15s ease; }
  .colegio:active{ transform:scale(.985); }
  .colegio img{ width:56px; height:56px; object-fit:contain; border-radius:14px; background:#fff; border:1px solid rgba(255,255,255,.35); padding:4px; flex:none; }
  .colegio .nombre{ font-size:17px; font-weight:800; line-height:1.25; }
  .colegio .sub{ font-size:13px; font-weight:600; color:#A9BCDD; margin-top:2px; }
  .colegio .flecha{ margin-left:auto; flex:none; width:36px; height:36px; border-radius:50%; background:var(--azul); color:#fff; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:900; box-shadow:0 6px 16px rgba(7,146,254,.45); }
  footer{ text-align:center; padding:18px; color:#8FA3C4; font-size:13px; font-weight:600; }

</head>
<body>
<header>
  <img src="/logo-correo.png" alt="PlataformaEDU">
  <h1>PlataformaEDU Padres</h1>
  <p>Las notas, la asistencia y los pagos de tu hijo, en un solo lugar.</p>
</header>
<main>
  <p class="intro">Selecciona el <strong>colegio</strong> de tu hijo para ingresar a su consulta de padres de familia.</p>
  <div class="lista" id="lista"></div>
</main>
<footer>Un servicio de <a href="https://plataformaedu.app">PlataformaEDU</a> · <a href="https://plataformaedu.app/privacidad/">Política de privacidad</a></footer>
<script>
  // Registro de colegios con consulta de padres activa.
  // Para agregar un colegio: una línea con su nombre, su logo y la URL de su consulta.
  var COLEGIOS = [
    { nombre: 'Centro Educativo Maravillas Infantiles', ciudad: 'Barranquilla', logo: 'https://maravillasinfantiles.com/escudo.png', url: 'https://maravillasinfantiles.com/padres/' },
    { nombre: 'Colegio Demo Santa Fe', ciudad: 'Demostración', logo: 'https://andreshernandz89.github.io/plataforma-demo/escudo.png', url: 'https://andreshernandz89.github.io/plataforma-demo/padres/' }
  ];
  var lista = document.getElementById('lista');
  COLEGIOS.forEach(function (c) {
    var a = document.createElement('a');
    a.className = 'colegio';
    a.href = c.url;
    var img = document.createElement('img');
    img.src = c.logo; img.alt = ''; img.loading = 'lazy';
    var txt = document.createElement('div');
    var n = document.createElement('div'); n.className = 'nombre'; n.textContent = c.nombre;
    var s = document.createElement('div'); s.className = 'sub'; s.textContent = c.ciudad;
    txt.appendChild(n); txt.appendChild(s);
    var f = document.createElement('div'); f.className = 'flecha'; f.textContent = '›';
    a.appendChild(img); a.appendChild(txt); a.appendChild(f);
    lista.appendChild(a);
  });
</script>
</body>
</html>
