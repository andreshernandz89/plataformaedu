    <title>Taxivoz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      /* Paleta oficial PlataformaEDU: azul #0792FE · marino #13213F · gris #5A6B84 */
      :root {
        --blue: #0792FE;
        --navy: #13213F;
        --gray: #5A6B84;
        --bg: #eef1f6;
        --surface: #ffffff;
        --surface-2: #e6ebf2;
        --ink: #13213F;
        --ink-soft: #5A6B84;
        --line: #cfd8e4;
        --radius: 18px;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c1626;
          --surface: #16263f;
          --surface-2: #1e3355;
          --ink: #f2f5f9;
          --ink-soft: #a9b8cc;
          --line: #2c425f;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body { font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
      button { font-family: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
      button, select, input { min-height: 2.25rem; }
      html { -webkit-text-size-adjust: 100%; }
      .wrap { max-width: 880px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px)); }
      [hidden] { display: none !important; }

      /* ---------- marca PlataformaEDU ---------- */
      .brandbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      .logo-mark { flex: none; width: 58px; height: auto; color: var(--navy); }
      .logo-mark .accent { stroke: var(--blue); }
      @media (prefers-color-scheme: dark) { .logo-mark { color: var(--ink); } }
      .app-name { font-size: 1.35rem; font-weight: 900; letter-spacing: -0.01em; color: var(--navy); white-space: nowrap; }
      .app-name span { color: var(--blue); }
      @media (prefers-color-scheme: dark) { .app-name { color: var(--ink); } }
      .spacer { flex: 1; }
      .brand-credit { text-align: center; margin-top: 34px; color: var(--gray); font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
      .brand-credit img { width: 24px; height: auto; }
      .brand-credit strong { color: var(--navy); font-weight: 800; }
      .brand-credit strong span { color: var(--blue); }
      @media (prefers-color-scheme: dark) { .brand-credit strong { color: var(--ink); } }

      .status-pill { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 0.95rem; font-weight: 600; }
      .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gray); flex: none; }
      .status-pill.listening .status-dot { background: var(--blue); animation: pulse 1s infinite; }
      .status-pill.speaking .status-dot { background: var(--navy); }
      @media (prefers-color-scheme: dark) { .status-pill.speaking .status-dot { background: var(--blue); } }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
      .alert { border: 1px solid var(--navy); color: var(--navy); background: var(--surface); border-radius: var(--radius); padding: 12px 16px; font-weight: 600; margin-bottom: 14px; line-height: 1.45; }
      @media (prefers-color-scheme: dark) { .alert { border-color: var(--blue); color: var(--ink); } }

      .live-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; }
      .live-card .who { font-size: 0.8rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue); margin: 0 0 6px; }
      .live-card .original { font-size: 1.05rem; color: var(--ink-soft); margin: 0 0 8px; line-height: 1.4; }
      .live-card .translated-row { display: flex; align-items: flex-start; gap: 12px; }
      .live-card .translated { font-size: clamp(1.35rem, 1.05rem + 2.4vw, 1.8rem); font-weight: 800; line-height: 1.25; margin: 0; flex: 1; overflow-wrap: break-word; }
      .replay-btn { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; }
      .replay-btn svg { width: 24px; height: 24px; }
      .live-card .interim { font-style: italic; color: var(--ink-soft); margin: 6px 0 0; min-height: 1.2em; }

      /* Botón único: tocar una vez; la escucha es continua y detecta el idioma sola. */
      .auto-main {
        width: 100%; border: none; border-radius: 22px; padding: 26px 16px 22px;
        background: var(--navy); color: #ffffff;
        display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
      }
      .auto-main .mic { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,0.14); display: inline-flex; align-items: center; justify-content: center; }
      .auto-main .mic svg { width: 34px; height: 34px; }
      .auto-main .big { font-size: clamp(1.35rem, 1.05rem + 2.2vw, 1.8rem); font-weight: 900; line-height: 1.1; }
      .auto-main .sub { font-size: 0.95rem; font-weight: 700; opacity: 0.8; }
      .auto-main.is-on { background: var(--blue); }
      .auto-main.is-on .mic { animation: pulse 1s infinite; }
      .auto-main:disabled { opacity: 0.45; cursor: not-allowed; }

      .typebox { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
      .typebox.highlight { border: 2px solid var(--blue); }
      .typebox .row { display: flex; gap: 8px; flex-wrap: wrap; }
      /* 16px en el campo: iOS no hace zoom automático al escribir */
      .typebox input[type="text"] { flex: 1 1 200px; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); min-height: 48px; }
      .typebox .go { background: var(--navy); color: #ffffff; border: none; border-radius: 12px; font-weight: 800; padding: 0 20px; min-height: 48px; font-size: 1rem; }
      .lang-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
      .lang-switch button { border: none; background: var(--surface); color: var(--ink-soft); font-weight: 700; padding: 0 14px; min-height: 48px; font-size: 0.95rem; }
      .lang-switch button[aria-pressed="true"] { background: var(--navy); color: #ffffff; }

      section.block { margin-top: 28px; }
      section.block h2 { font-size: 1.25rem; font-weight: 800; margin: 0 0 12px; }
      .phrase-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
      .phrase { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-height: 56px; font-size: 1.02rem; font-weight: 700; color: var(--ink); line-height: 1.3; }
      .phrase:active { background: var(--surface-2); }

      /* ---------- cualquier pantalla: celular, tablet y computador ---------- */
      /* En el celular todo se ve GRANDE: es la pantalla principal de uso
         (el conductor la mira de reojo y toca sin mirar con precisión). */
      @media (max-width: 480px) {
        .wrap { padding-left: 14px; padding-right: 14px; }
        .brandbar { flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
        .logo-mark { width: 66px; }
        .app-name { font-size: 1.55rem; }
        .status-pill { font-size: 1.05rem; padding: 10px 16px; }
        .status-dot { width: 12px; height: 12px; }
        .alert { font-size: 1.05rem; padding: 14px 16px; }
        .live-card { padding: 18px; }
        .live-card .who { font-size: 0.95rem; }
        .live-card .original { font-size: 1.2rem; }
        .live-card .translated { font-size: 1.75rem; }
        .live-card .interim { font-size: 1.05rem; }
        .replay-btn { width: 60px; height: 60px; }
        .replay-btn svg { width: 28px; height: 28px; }
        .auto-main { padding: 28px 14px 24px; border-radius: 20px; }
        .auto-main .mic { width: 84px; height: 84px; }
        .auto-main .mic svg { width: 40px; height: 40px; }
        .auto-main .big { font-size: 1.9rem; }
        .auto-main .sub { font-size: 1.05rem; }
        .typebox { padding: 14px; }
        .typebox input[type="text"] { font-size: 17px; min-height: 56px; padding: 12px 14px; }
        .typebox .go { flex: 1 1 100%; min-height: 56px; font-size: 1.1rem; }
        section.block h2 { font-size: 1.5rem; }
        .lang-switch button { min-height: 52px; padding: 0 22px; font-size: 1.05rem; }
        .phrase-grid { grid-template-columns: 1fr; }
        .phrase { font-size: 1.15rem; min-height: 68px; padding: 18px; }
        .brand-credit { font-size: 1rem; }
        .brand-credit img { width: 28px; }
      }
      @media (min-width: 481px) and (max-width: 900px) {
        .phrase-grid { grid-template-columns: repeat(2, 1fr); }
      }
      @media (min-width: 901px) {
        .wrap { max-width: 1020px; }
        .phrase-grid { grid-template-columns: repeat(3, 1fr); }
        .live-card .translated { font-size: 1.9rem; }
      }
      @media (max-height: 480px) and (orientation: landscape) {
        .auto-main { padding: 14px 12px 12px; }
        .auto-main .mic { width: 48px; height: 48px; }
        .auto-main .mic svg { width: 24px; height: 24px; }
      }
      @media (prefers-reduced-motion: reduce) { .status-pill.listening .status-dot, .auto-main.is-on .mic { animation: none; } }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="brandbar">
        <svg class="logo-mark" viewBox="0 0 78 54" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Logo de Taxivoz: un taxi con dos burbujas de conversación y ondas de voz a los lados">
          <!-- ondas de voz de la burbuja 1, hacia la izquierda -->
          <path d="M6 10a4 4 0 0 0 0 5" />
          <path d="M3 7a7 7 0 0 0 0 11" />
          <!-- burbuja 1: un idioma -->
          <rect x="10" y="6" width="21" height="13" rx="6.5" />
          <path d="M16 19l-1.5 4.5L20 20" />
          <circle cx="16.5" cy="12.5" r="0.7" fill="currentColor" />
          <circle cx="20.5" cy="12.5" r="0.7" fill="currentColor" />
          <circle cx="24.5" cy="12.5" r="0.7" fill="currentColor" />
          <!-- burbuja 2: el otro idioma -->
          <rect x="28" y="2" width="21" height="13" rx="6.5" style="stroke: var(--blue);" />
          <path d="M42 15l1.5 4.5L38 16" style="stroke: var(--blue);" />
          <circle cx="34.5" cy="8.5" r="0.7" fill="currentColor" style="stroke: var(--blue);" />
          <circle cx="38.5" cy="8.5" r="0.7" fill="currentColor" style="stroke: var(--blue);" />
          <circle cx="42.5" cy="8.5" r="0.7" fill="currentColor" style="stroke: var(--blue);" />
          <!-- ondas de voz de la burbuja 2, hacia la derecha -->
          <path d="M54 5a6 6 0 0 1 0 7" style="stroke: var(--blue);" />
          <path d="M58.5 2a10.5 10.5 0 0 1 0 13" style="stroke: var(--blue);" />
          <!-- taxi en una sola línea -->
          <path d="M8 40h6M56 40h12M14 40l4-11h22l6 8h10M18 29l-3 11M46 37l2 3" />
          <path d="M29 29v11M40 29v11" stroke-width="2" />
          <circle cx="22" cy="43" r="3.4" />
          <circle cx="50" cy="43" r="3.4" />
          <path d="M4 50h70" stroke-width="2" />
        </svg>
        <span class="app-name">Taxi<span>voz</span></span>
        <span class="spacer"></span>
        <span class="status-pill" id="statusPill"><span class="status-dot"></span><span id="statusText">Listo</span></span>
      </div>

      <div class="alert" id="micAlert" hidden></div>

      <div class="live-card" id="liveCard" hidden>
        <p class="who" id="liveWho"></p>
        <p class="original" id="liveOriginal"></p>
        <div class="translated-row">
          <p class="translated" id="liveTranslated"></p>
          <button class="replay-btn" id="liveReplay" type="button" aria-label="Repetir">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>
          </button>
        </div>
        <p class="interim" id="liveInterim"></p>
      </div>

      <button class="auto-main" id="btnStart" type="button">
        <span class="mic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor" stroke="none"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 19v3"/></svg>
        </span>
        <span class="big" id="btnStartLabel">▶ Iniciar</span>
        <span class="sub" id="btnStartSub">Detecta el idioma solo · ES ⇄ EN</span>
      </button>

      <form class="typebox" id="typeForm">
        <div class="row">
          <input type="text" id="typeInput" placeholder="Escribe en cualquier idioma…" autocomplete="off" autocapitalize="sentences" enterkeyhint="send" aria-label="Escribe una frase" />
          <button class="go" type="submit">Decir</button>
        </div>
      </form>

      <section class="block" aria-labelledby="phrasesTitle">
        <h2 id="phrasesTitle">Frases</h2>
        <div class="lang-switch" role="group" aria-label="Idioma de las frases" style="margin-bottom:12px;">
          <button type="button" id="phrEs" aria-pressed="true">ES</button>
          <button type="button" id="phrEn" aria-pressed="false">EN</button>
        </div>
        <div class="phrase-grid" id="phraseGridEs"></div>
        <div class="phrase-grid" id="phraseGridEn" hidden></div>
      </section>

    <script>
      (function () {
        "use strict";
        var $ = function (id) { return document.getElementById(id); };
        var statusPill = $("statusPill"), statusText = $("statusText");
        var btnStart = $("btnStart"), btnStartLabel = $("btnStartLabel"), btnStartSub = $("btnStartSub");
        var liveCard = $("liveCard"), liveWho = $("liveWho"), liveOriginal = $("liveOriginal"),
            liveTranslated = $("liveTranslated"), liveInterim = $("liveInterim"), liveReplay = $("liveReplay");
        var micAlert = $("micAlert");

        /* ============================================================
           Escucha continua con DETECCIÓN de idioma por frase.
           No hay turnos ni se sabe quién habla: cada frase se detecta
           (español → suena en inglés · inglés → suena en español),
           se traduce, se reproduce y la escucha se reanuda sola.
           El reconocedor de voz trabaja con un solo idioma por sesión,
           así que la escucha explora: empieza en español y, si hay
           silencio, prueba en inglés, y así sucesivamente hasta
           captar una frase en cualquiera de los dos idiomas.
           ============================================================ */
        var conversationActive = false;
        var listening = false;
        var scanLang = "es-CO"; // idioma de exploración actual; cambia solo ante silencio
        var lastUtterance = null;
        var recog = null;
        var retryTimer = null;

        // Cualquier navegador: Chrome, Edge y Safari (iPhone/Mac) exponen el
        // reconocimiento como SpeechRecognition o webkitSpeechRecognition.
        // Donde no exista (Firefox y otros), la página pasa al modo escribir.
        var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
        var synth = window.speechSynthesis || null;

        function setStatus(text, mode) {
          statusText.textContent = text;
          statusPill.classList.toggle("listening", mode === "listening");
          statusPill.classList.toggle("speaking", mode === "speaking");
        }
        function showAlert(msg) { micAlert.textContent = msg; micAlert.hidden = false; }
        function hideAlert() { micAlert.hidden = true; }
        function dirLabel(from, to) { return (from === "es" ? "ES" : "EN") + " → " + (to === "es" ? "ES" : "EN"); }

        function pickVoice(lang) {
          if (!synth) return null;
          var voices = synth.getVoices() || [];
          var prefix = lang.split("-")[0];
          for (var i = 0; i < voices.length; i++) {
            if (voices[i].lang && voices[i].lang.toLowerCase().indexOf(lang.toLowerCase()) === 0) return voices[i];
          }
          for (var j = 0; j < voices.length; j++) {
            if (voices[j].lang && voices[j].lang.toLowerCase().indexOf(prefix) === 0) return voices[j];
          }
          return null;
        }
        if (synth && synth.onvoiceschanged !== undefined) { synth.onvoiceschanged = function () { try { synth.getVoices(); } catch (e) {} }; }

        /* Los navegadores solo dejan sonar la voz automática si el PRIMER
           speak() ocurre dentro de un toque del usuario; si no, las
           frases que llegan después (reconocimiento + traducción, sin
           toque) se descartan en silencio. Por eso se «desbloquea» la
           voz con una frase muda en cada toque: Iniciar, frases y Decir. */
        var speechUnlocked = false;
        function unlockSpeech() {
          if (!synth || speechUnlocked) return;
          try {
            synth.getVoices();
            if (synth.resume) synth.resume();
            var u = new SpeechSynthesisUtterance(" ");
            u.volume = 0; u.rate = 2;
            synth.speak(u);
            speechUnlocked = true;
          } catch (e) {}
        }

        var speakSeq = 0;
        function speak(text, langCode, onDone) {
          lastUtterance = { text: text, lang: langCode };
          if (!synth) { if (onDone) onDone(); return; }
          var mySeq = ++speakSeq;
          var done = false;
          function finish() { if (!done && mySeq === speakSeq) { done = true; if (onDone) onDone(); } }
          function launch() {
            if (done || mySeq !== speakSeq) return;
            try { if (synth.resume) synth.resume(); } catch (e) {}
            var u = new SpeechSynthesisUtterance(text);
            u.lang = langCode === "en" ? "en-US" : "es-CO";
            var v = pickVoice(u.lang);
            if (v) u.voice = v;
            u.rate = 0.98;
            u.onend = finish;
            u.onerror = function (ev) {
              if (ev && ev.error && ev.error !== "interrupted" && ev.error !== "canceled") {
                showAlert("El sonido está bloqueado. Toca el botón 🔊 de la frase para oírla.");
              }
              finish();
            };
            setStatus("Hablando…", "speaking");
            try { synth.speak(u); } catch (e) { finish(); return; }
            // Vigilante: algunos Chrome nunca disparan onend. Solo se
            // termina cuando la síntesis ya no está hablando de verdad;
            // antes se cortaba la frase si duraba más de lo estimado.
            var minMs = Math.max(1800, text.length * 130);
            var waited = 0;
            var watch = setInterval(function () {
              if (done || mySeq !== speakSeq) { clearInterval(watch); return; }
              waited += 400;
              var busy = false;
              try { busy = !!(synth.speaking || synth.pending); } catch (e) {}
              if (waited >= 1200 && !busy && !speechUnlocked) {
                clearInterval(watch);
                showAlert("El sonido está bloqueado. Toca el botón 🔊 de la frase para oírla.");
                finish();
                return;
              }
              if ((waited >= minMs && !busy) || waited >= 30000) { clearInterval(watch); finish(); }
            }, 400);
          }
          // cancel() y speak() en el mismo instante hacen que Chrome
          // descarte la frase: se cancela y se espera un respiro.
          var wasBusy = false;
          try { wasBusy = !!(synth.speaking || synth.pending); } catch (e) {}
          if (wasBusy) {
            try { synth.cancel(); } catch (e) {}
            setTimeout(launch, 140);
          } else {
            launch();
          }
        }

        /* ---------- traducción con detección (sl=auto) ---------- */
        function googleCall(text, from, to) {
          var url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" + from + "&tl=" + to + "&dt=t&q=" + encodeURIComponent(text);
          return fetch(url).then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
            .then(function (data) {
              if (!data || !data[0]) throw new Error("bad response");
              var out = ""; data[0].forEach(function (seg) { if (seg && seg[0]) out += seg[0]; });
              if (!out.trim()) throw new Error("empty");
              // data[2] = idioma detectado por Google cuando sl=auto
              return { text: out, detected: (data[2] || "").toLowerCase().split("-")[0] };
            });
        }
        function translateMyMemory(text, from, to) {
          var url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=" + encodeURIComponent(from + "|" + to);
          return fetch(url).then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
            .then(function (data) {
              var t = data && data.responseData && data.responseData.translatedText;
              var okStatus = data && String(data.responseStatus) === "200";
              if (!okStatus || !t || /MYMEMORY WARNING|QUERY LENGTH LIMIT/i.test(t)) throw new Error("quota");
              return t;
            });
        }
        function translateFixed(text, from, to) {
          return googleCall(text, from, to).then(function (r) { return r.text; })
            .catch(function () { return translateMyMemory(text, from, to); });
        }
        // Detección local de respaldo, por vocabulario y signos propios.
        var ES_WORDS = ["el","la","los","las","de","que","en","un","una","por","favor","gracias","hola","dónde","donde","cuánto","cuanto","cuesta","quiero","vamos","para","con","está","esta","sí","buenas","señor","calle","carrera","aeropuerto","hotel","cuenta","tarjeta","efectivo","pare","aquí","aqui","llegamos","maletas","equipaje","tráfico","trafico","minutos","espero","puede","tiene","voy","necesito","buenos","días","dias","tarde","noche"];
        var EN_WORDS = ["the","to","please","thank","thanks","hello","hi","where","how","much","airport","hotel","can","you","i","need","want","go","stop","here","wait","card","cash","change","long","take","me","my","is","it","this","that","and","for","in","on","at","get","out","in","ride","fare","driver","street","avenue","terminal","flight","bags","luggage","faster","hurry"];
        function detectLocal(text) {
          var t = " " + text.toLowerCase() + " ";
          if (/[ñáéíóú¿¡]/.test(t)) return "es";
          var es = 0, en = 0, i, w;
          for (i = 0; i < ES_WORDS.length; i++) { w = ES_WORDS[i]; if (t.indexOf(" " + w + " ") >= 0 || t.indexOf(" " + w + ",") >= 0 || t.indexOf(" " + w + ".") >= 0 || t.indexOf(" " + w + "?") >= 0) es++; }
          for (i = 0; i < EN_WORDS.length; i++) { w = EN_WORDS[i]; if (t.indexOf(" " + w + " ") >= 0 || t.indexOf(" " + w + ",") >= 0 || t.indexOf(" " + w + ".") >= 0 || t.indexOf(" " + w + "?") >= 0) en++; }
          if (es === en) return null;
          return es > en ? "es" : "en";
        }
        // Detecta el idioma de la frase y la traduce al otro. Devuelve {from,to,text}.
        function translateDetect(text, recogHint) {
          return googleCall(text, "auto", "en").then(function (first) {
            var from = first.detected;
            if (from === "es") return { from: "es", to: "en", text: first.text };
            if (from === "en") {
              return googleCall(text, "auto", "es").then(function (second) {
                return { from: "en", to: "es", text: second.text };
              });
            }
            if (from) { // otro idioma: se traduce al español
              return googleCall(text, "auto", "es").then(function (third) {
                return { from: from, to: "es", text: third.text };
              });
            }
            throw new Error("no detect");
          }).catch(function () {
            var from = detectLocal(text) || recogHint || "es";
            var to = from === "es" ? "en" : "es";
            return translateFixed(text, from, to).then(function (t) { return { from: from, to: to, text: t }; });
          });
        }

        /* ---------- flujo de conversación ---------- */
        function showExchange(from, to, original, translated) {
          liveCard.hidden = false;
          liveWho.textContent = dirLabel(from, to);
          liveOriginal.textContent = "«" + original + "»";
          liveTranslated.textContent = translated;
          liveInterim.textContent = "";
        }

        function handleUtterance(text, recogHint) {
          setStatus("Traduciendo…", "");
          translateDetect(text, recogHint).then(function (res) {
            showExchange(res.from, res.to, text, res.text);
            speak(res.text, res.to, function () { resumeListening(); });
          }).catch(function () {
            liveCard.hidden = false;
            liveWho.textContent = "⚠";
            liveOriginal.textContent = "«" + text + "»";
            liveTranslated.textContent = "Sin conexión. Intenta de nuevo.";
            liveInterim.textContent = "";
            resumeListening();
          });
        }
        function resumeListening() {
          if (!conversationActive) { setStatus(SpeechRec ? "Listo" : "Modo escribir", ""); return; }
          scanLang = "es-CO"; // cada ciclo vuelve a explorar desde español
          clearTimeout(retryTimer);
          retryTimer = setTimeout(function () { if (conversationActive && !listening) startListening(); }, 450);
        }

        /* ---------- escucha continua explorando ES/EN ---------- */
        function stopListeningOnly() {
          clearTimeout(retryTimer);
          if (recog) { try { recog.onresult = null; recog.onend = null; recog.onerror = null; recog.stop(); } catch (e) {} recog = null; }
          listening = false;
        }
        function stopConversation() {
          conversationActive = false;
          stopListeningOnly();
          if (synth) { try { synth.cancel(); } catch (e) {} }
          btnStart.classList.remove("is-on");
          btnStartLabel.textContent = "▶ Iniciar";
          setStatus("Listo", "");
        }
        function startConversation() {
          if (!SpeechRec) return;
          unlockSpeech(); // dentro del toque: desbloquea la voz automática
          hideAlert();
          conversationActive = true;
          btnStart.classList.add("is-on");
          btnStartLabel.textContent = "⏹ Detener";
          scanLang = "es-CO";
          startListening();
        }
        function flipScan() { scanLang = scanLang === "es-CO" ? "en-US" : "es-CO"; }
        function retrySoon(flip) {
          if (!conversationActive) return;
          if (flip) flipScan();
          clearTimeout(retryTimer);
          retryTimer = setTimeout(function () { if (conversationActive && !listening) startListening(); }, 350);
        }

        function startListening() {
          if (!SpeechRec || listening) return;
          // Nunca arrancar el micrófono mientras la voz suena: el
          // cancel() de antes cortaba la reproducción a mitad de frase.
          if (synth) {
            var busy = false;
            try { busy = !!(synth.speaking || synth.pending); } catch (e) {}
            if (busy) {
              clearTimeout(retryTimer);
              retryTimer = setTimeout(function () { if (conversationActive && !listening) startListening(); }, 600);
              return;
            }
          }
          var thisLang = scanLang;
          var hint = thisLang === "en-US" ? "en" : "es";
          recog = new SpeechRec();
          recog.lang = thisLang; recog.interimResults = true; recog.continuous = false; recog.maxAlternatives = 1;
          listening = true;
          setStatus("Escuchando…", "listening");
          liveCard.hidden = false;
          liveWho.textContent = "Escuchando · ES / EN";
          liveOriginal.textContent = ""; liveTranslated.textContent = "";
          liveInterim.textContent = "Escuchando…";
          var finalText = "";
          recog.onresult = function (ev) {
            var interim = "";
            for (var i = ev.resultIndex; i < ev.results.length; i++) {
              if (ev.results[i].isFinal) finalText += ev.results[i][0].transcript;
              else interim += ev.results[i][0].transcript;
            }
            liveInterim.textContent = finalText + interim;
          };
          recog.onerror = function (ev) {
            listening = false; recog = null;
            if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
              stopConversation();
              showAlert("Permite el micrófono en tu navegador y vuelve a tocar Iniciar.");
            } else if (ev.error === "no-speech") {
              retrySoon(true); // silencio: explorar en el otro idioma
            } else if (ev.error !== "aborted") {
              retrySoon(false);
            }
          };
          recog.onend = function () {
            var text = finalText.trim();
            listening = false; recog = null;
            if (text) { handleUtterance(text, hint); }
            else if (conversationActive) { retrySoon(true); }
          };
          try { recog.start(); } catch (e) { listening = false; retrySoon(true); }
        }

        btnStart.addEventListener("click", function () {
          if (!SpeechRec) {
            // Sin reconocimiento de voz: el botón grande lleva al recuadro
            // de escribir, que traduce y reproduce igual que el micrófono.
            unlockSpeech();
            var inp = $("typeInput");
            inp.scrollIntoView({ block: "center", behavior: "smooth" });
            setTimeout(function () { try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); } }, 350);
            return;
          }
          if (conversationActive) stopConversation(); else startConversation();
        });

        if (!SpeechRec) {
          // Respaldo para navegadores sin reconocimiento de voz (Firefox y
          // otros): escribir + frases rápidas, y la traducción se reproduce
          // en voz alta si el navegador tiene síntesis de voz.
          btnStartLabel.textContent = "✎ Escribir una frase";
          btnStartSub.textContent = "Aquí no hay micrófono: escribe o toca una frase rápida";
          $("typeForm").classList.add("highlight");
          showAlert("Este navegador no escucha voz, pero Taxivoz sigue funcionando: escribe la frase en el recuadro o toca una frase rápida y la traducción " + (synth ? "se reproduce en voz alta." : "aparece en pantalla."));
          setStatus("Modo escribir", "");
        } else if (!synth) {
          showAlert("Este navegador no reproduce voz: las traducciones se muestran en pantalla.");
        }

        liveReplay.addEventListener("click", function () {
          if (lastUtterance) speak(lastUtterance.text, lastUtterance.lang, null);
        });

        /* ---------- escribir: también detecta el idioma solo ---------- */
        $("typeForm").addEventListener("submit", function (ev) {
          ev.preventDefault();
          var text = $("typeInput").value.trim();
          if (!text) return;
          unlockSpeech();
          $("typeInput").value = "";
          handleUtterance(text, null);
        });

        /* ---------- frases rápidas (pares fijos, sin reconocimiento) ---------- */
        var PHRASES_ES = [
          ["¿A dónde va?", "Where are you going?"],
          ["¿Tiene la dirección exacta?", "Do you have the exact address?"],
          ["Suba, por favor. Cuidado con la cabeza.", "Please get in. Watch your head."],
          ["¿Le ayudo con las maletas?", "Can I help you with your luggage?"],
          ["El viaje dura unos veinte minutos.", "The ride takes about twenty minutes."],
          ["Hay mucho tráfico; tomo una ruta alterna.", "There's a lot of traffic; I'll take another route."],
          ["¿Efectivo o tarjeta?", "Cash or card?"],
          ["¿Quiere el aire acondicionado más fuerte?", "Would you like the air conditioning stronger?"],
          ["¿A qué terminal del aeropuerto va?", "Which airport terminal are you going to?"],
          ["Puedo esperar cinco minutos.", "I can wait five minutes."],
          ["La tarifa es fija, no se preocupe.", "The fare is fixed, don't worry."],
          ["Ya llegamos. Gracias por viajar conmigo.", "We've arrived. Thank you for riding with me."]
        ];
        var PHRASES_EN = [
          ["Take me to the airport, please.", "Al aeropuerto, por favor."],
          ["How much is it?", "¿Cuánto cuesta?"],
          ["Can you go faster? I'm in a hurry.", "¿Puede ir más rápido? Tengo prisa."],
          ["Stop here, please.", "Pare aquí, por favor."],
          ["Can I pay by card?", "¿Puedo pagar con tarjeta?"],
          ["Keep the change.", "Quédese con el cambio."],
          ["Please wait for me here.", "Espéreme aquí, por favor."],
          ["How long does it take?", "¿Cuánto tiempo toma?"]
        ];
        function buildPhrases(grid, list, from, to) {
          list.forEach(function (pair) {
            var b = document.createElement("button");
            b.type = "button"; b.className = "phrase"; b.textContent = pair[0];
            b.addEventListener("click", function () {
              unlockSpeech();
              if (conversationActive) stopConversation();
              speak(pair[1], to, function () { setStatus(SpeechRec ? "Listo" : "Modo escribir", ""); });
              showExchange(from, to, pair[0], pair[1]);
            });
            grid.appendChild(b);
          });
        }
        buildPhrases($("phraseGridEs"), PHRASES_ES, "es", "en");
        buildPhrases($("phraseGridEn"), PHRASES_EN, "en", "es");

        var phrEs = $("phrEs"), phrEn = $("phrEn");
        phrEs.addEventListener("click", function () {
          phrEs.setAttribute("aria-pressed", "true"); phrEn.setAttribute("aria-pressed", "false");
          $("phraseGridEs").hidden = false; $("phraseGridEn").hidden = true;
        });
        phrEn.addEventListener("click", function () {
          phrEn.setAttribute("aria-pressed", "true"); phrEs.setAttribute("aria-pressed", "false");
          $("phraseGridEn").hidden = false; $("phraseGridEs").hidden = true;
        });
      })();
    </script>
  </body>
</html>
